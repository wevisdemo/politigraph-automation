name: Scrape & Update Bills / BillEvents

on:
  workflow_dispatch:
    inputs:
      parliament_term:
        description: 'Selecting the target term of parliament to scrape'
        required: false
        type: number
      scrape_in_progress:
        description: 'IN_PROGRESS'
        required: false
        default: 'true'
      scrape_enacted:
        description: 'ENACTED'
        required: false
        default: 'false'
      scrape_rejected:
        description: 'REJECTED'
        required: false
        default: 'false'

  schedule:
    - cron: '0 20 * * SUN,TUE'

permissions:
  contents: 'read'

jobs:
  run_python_script:
    runs-on: ubuntu-latest

    env:
      MODE: "dev"
      ACTIONS_RUNNER_DEBUG: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group bills_scraper

      - name: Scrape & Update Bills
        run: uv run scripts/scrape_bills.py
        env:
          POLITIGRAPH_SUBSCRIBTION_ENDPOINT: "${{ secrets.POLITIGRAPH_SUBSCRIBTION_ENDPOINT }}"
          POLITIGRAPH_TOKEN: "${{ secrets.POLITIGRAPH_TOKEN }}"
          PARLIAMENT_TERM: ${{ inputs.parliament_term }}
          SCRAPE_IN_PROGRESS: ${{ inputs.scrape_in_progress }}
          SCRAPE_ENACTED: ${{ inputs.scrape_enacted }}
          SCRAPE_REJECTED: ${{ inputs.scrape_rejected }}
          CLIENT_CERT_STRING: "${{ secrets.CLIENT_CERT_STRING }}"

      - name: Check & Update BillMergeEvents
        run: uv run scripts/update_merge_events.py
        env:
          POLITIGRAPH_SUBSCRIBTION_ENDPOINT: "${{ secrets.POLITIGRAPH_SUBSCRIBTION_ENDPOINT }}"
          POLITIGRAPH_TOKEN: "${{ secrets.POLITIGRAPH_TOKEN }}"
          CLIENT_CERT_STRING: "${{ secrets.CLIENT_CERT_STRING }}"